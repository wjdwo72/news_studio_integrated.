name: 📰 뉴스 자동 수집

on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다 자동 실행
  workflow_dispatch:           # GitHub에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 뉴스 수집 실행
        run: node fetch-news.js

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.json
          git diff --staged --quiet \
            && echo "변경 없음 — 스킵" \
            || (git commit -m "📰 뉴스 업데이트 $(date '+%Y-%m-%d %H:%M KST' -d '+9 hours')" && git push)
